name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd /home/torasic/deploy/devops

          docker compose pull app && \
          docker compose up -d --wait --wait-timeout 60

          docker compose ps

          printf '%s\n' "$IMAGE_TAG" > last-known-good.txt

          echo "Last known good:"
          cat last-known-good.txt

  rollback:
    name: Rollback staging
    if: ${{ !cancelled() && needs.deploy.result == 'failure' }}
    needs:
      - test
      - build
      - deploy
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read last known good
        run: |
          cd /home/torasic/deploy/devops

          IMAGE_TAG=$(cat last-known-good.txt)

          echo "Rolling back to:"
          echo "$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Roll back deployment
        run: |
          cd /home/torasic/deploy/devops

          docker compose pull app && \
          docker compose up -d --wait --wait-timeout 60

      - name: Verify rollback
        run: |
          cd /home/torasic/deploy/devops

          echo "Running image:"
          docker inspect devops-prod-app --format '{{.Config.Image}}'

          echo "Health:"
          docker inspect devops-prod-app --format '{{.State.Health.Status}}'
