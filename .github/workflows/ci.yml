name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with automatic rollback
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          cd /home/torasic/deploy/devops

          PREVIOUS_SHA=$(cat last-known-good.txt)

          echo "Previous known-good: $PREVIOUS_SHA"
          echo "Deploying: $IMAGE_TAG"

          if docker compose pull app && \
             docker compose up -d --wait --wait-timeout 60; then

            echo "Deployment healthy"
            printf '%s\n' "$IMAGE_TAG" > last-known-good.txt

            echo "New last-known-good:"
            cat last-known-good.txt

          else

            echo "Deployment failed"
            echo "Rolling back to: $PREVIOUS_SHA"

            export IMAGE_TAG="$PREVIOUS_SHA"

            docker compose pull app
            docker compose up -d --wait --wait-timeout 60

            echo "Rollback completed"

            echo "Running image:"
            docker inspect devops-prod-app --format '{{.Config.Image}}'

            echo "Health:"
            docker inspect devops-prod-app --format '{{.State.Health.Status}}'

            exit 1
          fi

      - name: Show application logs
        run: |
          cd /home/torasic/deploy/devops
          docker compose logs --tail=20 app
