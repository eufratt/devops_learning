name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Blue-green deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd /home/torasic/deploy/devops

          active="$(cat active-color.txt)"

          case "$active" in
            blue)
              target="green"
              old_service="app"
              target_service="app-green"
              target_backend="app-green:8080"
              ;;
            green)
              target="blue"
              old_service="app-green"
              target_service="app"
              target_backend="app:8080"
              ;;
            *)
              echo "Invalid active color: $active"
              exit 1
              ;;
          esac

          echo "Active color : $active"
          echo "Target color : $target"
          echo "Image SHA    : $IMAGE_TAG"

          export IMAGE_TAG

          echo "Pull target image..."
          docker compose pull "$target_service"

          echo "Start target..."
          docker compose up -d \
            --force-recreate \
            --wait \
            --wait-timeout 60 \
            "$target_service"

          echo "Target health:"
          docker inspect "$(
            docker compose ps -q "$target_service"
          )" --format '{{.State.Health.Status}}'

          echo "Backup current Nginx config..."
          cp nginx.conf nginx.conf.before-switch

          echo "Switch Nginx to $target..."
          sed \
            "s/server app-green:8080;/server ${target_backend};/" \
            nginx.conf \
            | sed \
            "s/server app:8080;/server ${target_backend};/" \
            > nginx.conf.next

          mv nginx.conf.next nginx.conf

          echo "Validate Nginx..."
          docker exec devops-prod-proxy nginx -t

          echo "Reload Nginx..."
          docker exec devops-prod-proxy nginx -s reload

          echo "Verify traffic..."

          for i in $(seq 1 10); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:18080/health; then
              echo
              echo "Traffic verification successful"
              break
            fi

            echo "Health check attempt $i failed, retrying..."
            sleep 2

            if [ "$i" -eq 10 ]; then
              echo "Traffic verification failed"
              exit 1
            fi
          done

          echo

          echo "Write last-known-good..."
          printf '%s\n' "$IMAGE_TAG" > last-known-good.txt

          echo "Promote active color..."
          printf '%s\n' "$target" > active-color.txt

          echo "Stop old color..."
          docker compose stop "$old_service" || \
            echo "Warning: failed to stop old color $old_service"

          echo "Active color:"
          cat active-color.txt

          echo "Last known good:"
          cat last-known-good.txt

          echo "Running containers:"
          docker compose ps

  rollback:
    name: Rollback staging
    if: ${{ !cancelled() && needs.deploy.result == 'failure' }}
    needs:
      - test
      - build
      - deploy
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    steps:
      - name: Restore active color
        run: |
          set -euo pipefail

          cd /home/torasic/deploy/devops

          active="$(cat active-color.txt)"

          case "$active" in
            blue)
              backend="app:8080"
              ;;
            green)
              backend="app-green:8080"
              ;;
            *)
              echo "Invalid active color: $active"
              exit 1
              ;;
          esac

          echo "Restoring traffic to: $active"

          cp nginx.conf nginx.conf.failed-deploy

          sed \
            "s/server app-green:8080;/server ${backend};/" \
            nginx.conf \
            | sed \
            "s/server app:8080;/server ${backend};/" \
            > nginx.conf.rollback

          mv nginx.conf.rollback nginx.conf

          docker exec devops-prod-proxy nginx -t
          docker exec devops-prod-proxy nginx -s reload

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:18080/health

          echo
          echo "Traffic restored to $active"
