name: Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    steps:
      - name: Roll back to previous color
        run: |
          set -euo pipefail

          cd /home/torasic/deploy/devops

          active="$(cat active-color.txt)"

          case "$active" in
            blue)
              rollback_color="green"
              rollback_service="app-green"
              rollback_container="devops-prod-app-green"
              rollback_backend="app-green:8080"
              ;;
            green)
              rollback_color="blue"
              rollback_service="app"
              rollback_container="devops-prod-app"
              rollback_backend="app:8080"
              ;;
            *)
              echo "Invalid active color: $active"
              exit 1
              ;;
          esac

          echo "Current active color : $active"
          echo "Rollback color       : $rollback_color"

          echo "Previous image:"
          docker inspect "$rollback_container" \
            --format '{{.Config.Image}}'

          echo "Starting rollback container..."
          docker start "$rollback_container"

          echo "Waiting for rollback health..."
          for i in $(seq 1 30); do
            status="$(
              docker inspect "$rollback_container" \
                --format '{{.State.Health.Status}}'
            )"

            echo "Health attempt $i: $status"

            if [ "$status" = "healthy" ]; then
              break
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Rollback container became unhealthy"
              exit 1
            fi

            sleep 2
          done

          status="$(
            docker inspect "$rollback_container" \
              --format '{{.State.Health.Status}}'
          )"

          if [ "$status" != "healthy" ]; then
            echo "Rollback container did not become healthy"
            exit 1
          fi

          echo "Switching Nginx to $rollback_color..."

          cp nginx.conf nginx.conf.manual-rollback

          sed \
            "s/server app-green:8080;/server ${rollback_backend};/" \
            nginx.conf \
            | sed \
            "s/server app:8080;/server ${rollback_backend};/" \
            > nginx.conf.rollback

          mv nginx.conf.rollback nginx.conf

          docker exec devops-prod-proxy nginx -t
          docker exec devops-prod-proxy nginx -s reload

          echo "Verifying traffic..."

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:18080/health

          echo

          echo "Stopping current color..."
          case "$active" in
            blue)
              docker stop devops-prod-app || true
              ;;
            green)
              docker stop devops-prod-app-green || true
              ;;
          esac

          printf '%s\n' "$rollback_color" > active-color.txt

          rollback_image="$(
            docker inspect "$rollback_container" \
              --format '{{.Config.Image}}'
          )"

          rollback_tag="${rollback_image##*:}"

          printf '%s\n' "$rollback_tag" > last-known-good.txt

          echo "Rollback complete"
          echo "Active color:"
          cat active-color.txt

          echo "Last known good:"
          cat last-known-good.txt

          docker compose ps
