name: Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    permissions:
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read last known good version
        id: version
        run: |
          cd /home/torasic/deploy/devops
          IMAGE_TAG=$(cat last-known-good.txt)
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Rolling back to $IMAGE_TAG"

      - name: Roll back
        run: |
          cd /home/torasic/deploy/devops

          docker compose pull app && \
          docker compose up -d --wait --wait-timeout 60

      - name: Verify rollback
        run: |
          cd /home/torasic/deploy/devops

          echo "Running image:"
          docker inspect devops-prod-app --format '{{.Config.Image}}'

          echo "Health:"
          docker inspect devops-prod-app --format '{{.State.Health.Status}}'
